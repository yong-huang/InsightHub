name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Vite 8 requires Node ^20.19.0 || >=22.12.0
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: insighthub/package-lock.json

      - name: Install dependencies
        run: cd insighthub && npm ci

      - name: Lint
        run: cd insighthub && npm run lint

      - name: Type check
        run: cd insighthub && npx tsc -b --noEmit

      - name: Test
        run: cd insighthub && npm run test

      - name: Build
        run: cd insighthub && npm run build
